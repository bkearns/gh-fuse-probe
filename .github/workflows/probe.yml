name: fuse-lazyfs-probe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: FUSE + LazyFS capability probe
        run: bash probe.sh
      - name: LazyFS metadata-semantics probe
        run: bash probe2.sh
